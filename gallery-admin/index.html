<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar galería | Happy Deco</title><link rel="stylesheet" href="/styles.css"></head>
<body><main>
  <header><div class="logo">Happy <span>Deco</span></div><p>Panel privado</p></header>
  <section class="card">
    <p class="eyebrow">Galería del sitio</p><h1>Publicar nuevas fotos</h1>
    <p class="intro">Elegí una o varias imágenes. Las vamos a optimizar y publicar automáticamente en la galería.</p>
    <label>Contraseña<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña del equipo"></label>
    <label>Nombre del evento <small>(opcional)</small><input id="title" type="text" maxlength="80" placeholder="Ej.: Cumpleaños de Amanda"></label>
    <label class="picker" for="files"><strong>Elegir fotos</strong><span>JPG, PNG o WebP · hasta 10 por vez</span></label>
    <input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
    <div id="preview" class="preview" aria-live="polite"></div>
    <button id="publish" disabled>Publicar en la galería</button>
    <p id="status" class="status" role="status"></p>
  </section>
  <a class="back" href="https://happy-deco.github.io/happy-deco-web/#galeria">Ver galería pública ↗</a>
</main><script src="/app.js"></script></body></html>
